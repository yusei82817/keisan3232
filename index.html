<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高精度リーマンゼータ関数計算機</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:#111827;color:#e5e7eb}main{max-width:950px;margin:auto;padding:28px 18px 50px}.card{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:18px;margin:16px 0}h1{margin:0 0 8px}.lead,.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-weight:700}input,button{box-sizing:border-box;width:100%;margin-top:7px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:#f9fafb;padding:11px;font:inherit}button{cursor:pointer;background:#2563eb;border-color:#2563eb;font-weight:800}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{width:auto;background:#374151;border-color:#4b5563}.result{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}.big{font-size:1.3rem;font-weight:800}.ok{color:#86efac}.bad{color:#fca5a5}code{background:#111827;padding:2px 6px;border-radius:6px}
</style>
</head><body><main>
<h1>高精度リーマンゼータ関数計算機</h1>
<p class="lead">任意精度の10進数で複素数 <code>s=σ+it</code> を扱います。標準のJavaScript NumberではなくBigIntベースの固定小数点演算を使用します。</p>
<section class="card"><div class="grid">
<label>実部 σ<input id="re" value="2"></label>
<label>虚部 t<input id="im" value="0"></label>
<label>精度（10進桁）<input id="digits" type="number" min="20" max="200" step="10" value="50"></label>
<label>Euler–Maclaurin N<input id="N" type="number" min="16" max="10000" value="64"></label>
<label>補正項数<input id="terms" type="number" min="2" max="20" value="10"></label>
</div><button id="calc">ζ(s) を高精度計算</button><div class="quick">
<button data-re="2" data-im="0">ζ(2)</button><button data-re="0" data-im="0">ζ(0)</button><button data-re="-1" data-im="0">ζ(-1)</button><button data-re="-2" data-im="0">ζ(-2)</button><button data-re="0.5" data-im="14.134725141734693790457251983562470270784257115699">第1零点付近</button>
</div></section>
<section class="card"><h2>結果</h2><div id="status" class="muted">計算待機中</div><div id="value" class="result big">-</div><div id="abs" class="result"></div><div id="arg" class="result"></div><div id="err" class="muted"></div></section>
<section class="card"><h2>計算方法</h2><p id="method" class="muted">-</p><p class="muted">Re(s)>0ではEuler–Maclaurin型展開、Re(s)≤0では関数方程式を使用します。s=1は単純極です。高精度化では計算途中も固定小数点BigIntで保持します。</p></section>
</main>
<script>
// Decimal arbitrary-precision complex arithmetic using BigInt fixed-point.
class D{static P=60;constructor(n=0){if(n instanceof D)this.v=n.v;else{let s=String(n).trim();let neg=s[0]=='-';if(neg)s=s.slice(1);let [a,b='']=s.split('.');b=(b+'0'.repeat(D.P)).slice(0,D.P);this.v=BigInt((neg?'-':'')+(a||'0')+b)}}static from(v){let x=Object.create(D.prototype);x.v=BigInt(v);return x}add(b){return D.from(this.v+b.v)}sub(b){return D.from(this.v-b.v)}neg(){return D.from(-this.v)}mul(b){return D.from(this.v*b.v/D.S)}div(b){return D.from(this.v*D.S/b.v)}abs(){return D.from(this.v<0n?-this.v:this.v)}cmp(b){return this.v<b.v?-1:this.v>b.v?1:0}toString(n=30){let neg=this.v<0n,v=neg?-this.v:this.v,s=v.toString().padStart(D.P+1,'0'),a=s.slice(0,-D.P),b=s.slice(-D.P).slice(0,n).replace(/0+$/,'');return (neg?'-':'')+a+(b?'.'+b:'')}}D.S=10n**BigInt(D.P);
const d=(x)=>new D(x), ZERO=d(0), ONE=d(1), TWO=d(2), PI=d('3.141592653589793238462643383279502884197169399375105820974944');
function C(r=ZERO,i=ZERO){return{r:r instanceof D?r:d(r),i:i instanceof D?i:d(i)}}
const ca=(a,b)=>C(a.r.add(b.r),a.i.add(b.i)), cs=(a,b)=>C(a.r.sub(b.r),a.i.sub(b.i)), cn=a=>C(a.r.neg(),a.i.neg()), cm=(a,b)=>C(a.r.mul(b.r).sub(a.i.mul(b.i)),a.r.mul(b.i).add(a.i.mul(b.r))), cd=(a,b)=>{let q=b.r.mul(b.r).add(b.i.mul(b.i));return C(a.r.mul(b.r).add(a.i.mul(b.i)).div(q),a.i.mul(b.r).sub(a.r.mul(b.i)).div(q))};
const scale=(a,k)=>C(a.r.mul(k),a.i.mul(k));
function expD(x){let y=x.v<0n?expD(x.neg()):expDpos(x);return x.v<0n?ONE.div(y):y}function expDpos(x){let term=ONE,sum=ONE;for(let k=1;k<220;k++){term=term.mul(x).div(d(k));sum=sum.add(term);if(term.abs().v<1n)break}return sum}
function sinD(x){let y=x;while(y.cmp(PI)>0)y=y.sub(PI.mul(TWO));while(y.cmp(PI.neg())<0)y=y.add(PI.mul(TWO));let x2=y.mul(y),term=y,sum=y;for(let k=1;k<120;k++){term=term.mul(x2).div(d((2*k)*(2*k+1))).neg();sum=sum.add(term);if(term.abs().v<1n)break}return sum}
function cosD(x){let y=x,x2=y.mul(y),term=ONE,sum=ONE;for(let k=1;k<120;k++){term=term.mul(x2).div(d((2*k-1)*(2*k))).neg();sum=sum.add(term);if(term.abs().v<1n)break}return sum}
function sinhD(x){return expD(x).sub(expD(x.neg())).div(TWO)}function coshD(x){return expD(x).add(expD(x.neg())).div(TWO)}
function sinC(z){return C(sinD(z.r).mul(coshD(z.i)),cosD(z.r).mul(sinhD(z.i)))}
function expC(z){let e=expD(z.r);return C(e.mul(cosD(z.i)),e.mul(sinD(z.i)))}
function logReal(x){if(x.v<=0n)throw Error('log domain');let n=0, y=x;while(y.cmp(TWO)>0){y=y.div(TWO);n++}let z=y.sub(ONE).div(y.add(ONE)),z2=z.mul(z),term=z,sum=z;for(let k=1;k<140;k++){term=term.mul(z2);let q=term.div(d(2*k+1));sum=sum.add(q);if(q.abs().v<1n)break}return sum.mul(TWO).add(d(n).mul(PI).mul(d('0'))).add(d(n).mul(d('0.693147180559945309417232121458176568075500134360255254120680')))}
function logC(z){let mag=z.r.mul(z.r).add(z.i.mul(z.i));let lr=logReal(mag).div(TWO);let ratio=z.i.div(z.r);let at=atan(ratio);if(z.r.v<0n)at=z.i.v>=0n?at.add(PI):at.sub(PI);return C(lr,at)}
function atan(x){let ax=x.abs(), y=ax.cmp(ONE)>0?ONE.div(ax):ax;let y2=y.mul(y),term=y,sum=y;for(let k=1;k<160;k++){term=term.mul(y2).neg();let q=term.div(d(2*k+1));sum=sum.add(q);if(q.abs().v<1n)break}let r=ax.cmp(ONE)>0?PI.div(TWO).sub(sum):sum;return x.v<0n?r.neg():r}
function powC(a,z){return expC(cm(z,logC(a)))}
function gamma(z){ // Lanczos, arbitrary precision arithmetic.
 const p=['0.99999999999980993','676.5203681218851','-1259.1392167224028','771.32342877765313','-176.61502916214059','12.507343278686905','-0.13857109526572012','0.0000099843695780195716','0.00000015056327351493116'];
 if(z.r.cmp(d('0.5'))<0)return cd(C(PI),cm(sinC(scale(z,PI.div(TWO))),gamma(cs(ONE,z))));let zm1=cs(z,ONE),x=d(p[0]);for(let i=1;i<p.length;i++)x=x.add(d(p[i]).div(zm1.add(d(i))));let t=zm1.add(d('7.5'));return C(d('2.5066282746310005024157652848110452530069867406099383166293').mul(powC(C(t),addD(zm1,d('0.5'))).r).mul(expD(t.neg())).mul(x));}
function addD(a,b){return a.add(b)}
function rising(s,n){let r=C(ONE);for(let j=0;j<n;j++)r=cm(r,ca(s,C(d(j))));return r}
const B=['0.1666666666666666666666666666666666666666666666666666666666666667','-0.0333333333333333333333333333333333333333333333333333333333333333','0.0238095238095238095238095238095238095238095238095238095238095238','-0.0333333333333333333333333333333333333333333333333333333333333333','0.0757575757575757575757575757575757575757575757575757575757575758','-0.2531135531135531135531135531135531135531135531135531135531135531','1.1666666666666666666666666666666666666666666666666666666666666667','-7.0921568627450980392156862745098039215686274509803921568627450980','54.9711779448621553884711779448621553884711779448621553884711779449','-529.124242424242424242424242424242424242424242424242424242424242424','6192.12318840579710144927536231884057971014492753623188405797101449'];
function powIntBase(N,z){return powC(C(d(N)),z)}
function zetaEM(s,N,terms){let sum=C();for(let n=1;n<=N;n++)sum=ca(sum,powIntBase(n,cn(s)));sum=ca(sum,cd(powIntBase(N,cs(ONE,s)),cs(s,ONE)));sum=ca(sum,scale(powIntBase(N,cn(s)),d('0.5')));for(let k=1;k<=terms;k++){let r=rising(s,2*k-1),coeff=d(B[k-1]).div(factD(2*k));sum=ca(sum,scale(cm(r,powIntBase(N,cn(s))),coeff));}return sum}
function factD(n){let r=ONE;for(let i=2;i<=n;i++)r=r.mul(d(i));return r}
function zeta(s,N,terms){if(s.r.cmp(ONE)==0&&s.i.v==0n)return null;if(s.r.v==0n&&s.i.v==0n)return C(d('-0.5'));if(s.i.v==0n&&s.r.v<0n&&Number(s.r.toString(5))%2===0)return C();if(s.r.cmp(ZERO)>0)return zetaEM(s,N,terms);let om=cs(ONE,s);let f=cm(powC(C(TWO),s),cm(powC(C(PI),cs(s,ONE)),cm(sinC(scale(s,PI.div(TWO))),gamma(om))));return cm(f,zetaEM(om,N,terms))}
function calc(){try{let digits=Math.max(20,Math.min(200,Number(document.getElementById('digits').value)||50));D.P=digits+10;D.S=10n**BigInt(D.P);let re=d(document.getElementById('re').value),im=d(document.getElementById('im').value),s=C(re,im),N=Math.max(16,Math.min(10000,Number(document.getElementById('N').value)||64)),terms=Math.max(2,Math.min(11,Number(document.getElementById('terms').value)||10));let st=document.getElementById('status'),v=document.getElementById('value');if(re.cmp(ONE)==0&&im.v==0n){st.textContent='s=1 は単純極です。';st.className='bad';v.textContent='∞（極）';return}let z=zeta(s,N,terms), out=`${z.r.toString(digits)} ${z.i.v>=0n?'+':'-'} ${z.i.abs().toString(digits)} i`;if(z.i.v==0n)out=z.r.toString(digits);st.textContent=`s = ${re.toString(digits)} ${im.v>=0n?'+':'-'} ${im.abs().toString(digits)}i`;st.className='ok';v.textContent=`ζ(s) ≈ ${out}`;document.getElementById('abs').textContent='';document.getElementById('arg').textContent='';document.getElementById('err').textContent=`内部精度: ${D.P} 桁（要求 ${digits} 桁）`;document.getElementById('method').textContent=re.cmp(ZERO)>0?`Euler–Maclaurin（N=${N}, 補正項=${terms}）`:`関数方程式 + Euler–Maclaurin（N=${N}, 補正項=${terms}）`;}catch(e){document.getElementById('status').textContent='計算エラー: '+e.message;document.getElementById('status').className='bad'}}
document.getElementById('calc').onclick=calc;document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{re.value=b.dataset.re;im.value=b.dataset.im;calc()});const re=document.getElementById('re'),im=document.getElementById('im');calc();
</script></body></html>
